# Log to stdout/stderr so Cloud Run logs show useful info
error_log  /dev/stderr notice;
access_log /dev/stdout;

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Static SPA
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Health check
  location = /health {
    add_header Content-Type text/plain;
    return 200 "OK";
  }
}
